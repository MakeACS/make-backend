syntax="proto3";

package auth;
import "common/plugin.proto"; 


option go_package = 'make-backend/internal/plugins/auth';

message UserLoginCallback {
  string email = 1;
  string full_name = 2;
  string preferred_name = 3;
  string profile_picture_url = 4;
  string originalURL = 5;
}

message UserLoginStartRequest {
  string originalURL = 1;
}

enum UserLoginResponseType {
  USER_LOGIN_RESPONSE_TYPE_UNSPECIFIED = 0;
  USER_CREATED = 1;
  USER_FOUND = 2;
  USER_ALREADY_EXISTS_OTHER_PROVIDER = 3;
  ERROR = 4;
}

message UserLoginResponse {
  UserLoginResponseType response_type = 1;
  int32 user_id = 2;
  string error_message = 3;
}

message UserLogOffRequest {
  oneof user {
    int32 id = 1;
    string email = 2;
  }
  string signed_out_url = 3;
}



message SetKV {
    string key = 1;
    string value = 2;
}


message LoginRequest { 
    string url = 1; 
    int32 code = 2;
    repeated SetKV setHeaders = 3;  
    bytes body = 4;
}


message RedirectURL { 
    string gotoUrl = 1; 
    repeated SetKV setCookies = 2;  
}

message Subserver{
    int32 port = 1;
}
message PluginInitRequest {
  uint64 callback_broker_id = 1;
}


service AuthPlugin {
  rpc Info(common.PluginInitialMessage) returns (common.PluginInfo);
  rpc Heartbeat(common.Empty) returns (common.HeartbeatInfo);
  rpc GetLoginRequest(UserLoginStartRequest) returns (LoginRequest);
  rpc Logout(UserLogOffRequest) returns (common.Empty);
  // end user doesn't have to use this, they have to implement register callback in go land. this is intercepted by the rpc server and the details taken care of for the actual plugin
  rpc internalInitializeCallbacks(PluginInitRequest) returns (common.Empty);
}

service AuthCallbackService {
  rpc UserLoggedIn(UserLoginCallback) returns (RedirectURL);
  rpc UserLoggedOut(UserLogOffRequest) returns (common.Empty);
}
